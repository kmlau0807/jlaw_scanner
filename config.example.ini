[email]
# Gmail SMTP. Use an APP PASSWORD, not your normal login password.
# Generate one at: Google Account > Security > App passwords
smtp_host = smtp.gmail.com
smtp_port = 587
sender = you@gmail.com
password = YOUR_GMAIL_APP_PASSWORD
recipients = you@gmail.com
subject_prefix = [JLaw Scanner]
# number of top picks (per side, per market) to embed a chart for in the email
chart_top_n = 5

[scan]
# comma-separated markets to scan: hk, us
markets = hk,us
# how many top names to report per market per side
top_n = 10
# minimum number of independent edges that must stack at one price (M.E.T.A.)
min_metascore = 3
# history window pulled per symbol
lookback_days = 180
# drop symbols with average daily dollar volume below this (avoid illiquid)
min_avg_dollar_volume = 5000000
# relative-strength benchmark indices
rs_index_us = ^GSPC
rs_index_hk = ^HSI
# skip anything already in portfolio.json (you own it -- a fresh BUY is noise).
# Owned names are still tracked and listed at the bottom of the daily email.
exclude_holdings = true

[schedule]
# APScheduler cron. Cross-platform (Windows or Linux).
enabled = false
cron_hour = 9
cron_minute = 0
# IANA timezone, e.g. Asia/Hong_Kong, America/New_York
timezone = Asia/Hong_Kong

[paths]
cache_dir = cache
universe_dir = universe

[web]
# Interface/port the dashboard binds to.
#   0.0.0.0        = reachable from other machines on the same LAN (default)
#   192.168.254.11 = limit to this PC's LAN interface only
#   127.0.0.1      = local only (not shared)
host = 0.0.0.0
port = 5000
